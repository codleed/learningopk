services:
  postgres:
    image: postgres:16
    container_name: learningopk_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: learningo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learningo"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: learningopk_pgbouncer
    ports:
      - "6432:6432"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: learningo
      DB_USER: postgres
      DB_PASSWORD: password
      AUTH_TYPE: scram-sha-256
      AUTH_QUERY: "SELECT usename, passwd FROM pg_shadow WHERE usename=$1"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "25"
      MIN_POOL_SIZE: "10"
      RESERVE_POOL_SIZE: "5"
      LISTEN_PORT: "6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: learningopk_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: learningopk_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: learningopk_minio_init
    depends_on:
      - minio
    restart: "no"
    volumes:
      - ./infra/minio/public-read.json:/policies/public-read.json:ro
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin123; do sleep 1; done &&
      mc mb --ignore-existing local/learningo-media &&
      mc anonymous set-json /policies/public-read.json local/learningo-media
      "

  nginx:
    image: nginx:alpine
    container_name: learningopk_nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learningopk_backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:password@pgbouncer:6432/learningo
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: yOocWXqo7cx5Zde53GtGcCn4Q6qoNszeoQ8aLGLze1k=
      BETTER_AUTH_URL: http://nginx:80
      FRONTEND_ORIGIN: http://localhost:3000
      MISTRAL_API_KEY: 0MC0Dro56V7KOnEpeQMhanSXr1XK37l8
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: false
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: learningo-media
      MINIO_PUBLIC_URL: http://localhost:9000
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  minio_data:
