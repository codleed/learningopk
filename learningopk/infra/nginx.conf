worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/xml+rss text/javascript application/x-javascript;

    # Buffer optimizations
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=ip_limit:10m rate=1000r/m;
    limit_req_zone $http_x_user_id zone=user_limit:10m rate=100r/m;

    # Upstream backend (single instance for dev, scale for prod)
    upstream backend_cluster {
        least_conn;
        
        server backend:3001 max_fails=3 fail_timeout=30s;
        
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check endpoint (no rate limit)
        location /api/health {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        # AI chat streaming endpoint - disable buffering for real-time token delivery
        location = /api/ai/chat {
            limit_req zone=ip_limit burst=50 nodelay;
            limit_req zone=user_limit burst=20 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering for streaming
            proxy_buffering off;
            proxy_cache off;

            # Longer timeouts for AI generation
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Pass user ID from JWT for rate limiting
            set $user_id "";
            if ($http_authorization ~ "^Bearer\s+(\S+)") {
                set $user_id $1;
            }
            proxy_set_header X-User-ID $user_id;
        }

        # Rate limiting for API routes
        location /api/ {
            # IP-based rate limiting: 1000 req/min
            limit_req zone=ip_limit burst=50 nodelay;
            
            # User-based rate limiting: 100 req/min (if JWT present)
            limit_req zone=user_limit burst=20 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Pass user ID from JWT for rate limiting
            set $user_id "";
            if ($http_authorization ~ "^Bearer\s+(\S+)") {
                set $user_id $1;
            }
            proxy_set_header X-User-ID $user_id;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # AI chat sessions endpoint (REST, not WebSocket)
        location /api/ai/sessions {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            limit_req zone=ip_limit burst=50 nodelay;
            limit_req zone=user_limit burst=20 nodelay;
        }

        # Static files from frontend
        location /_next/static {
            proxy_pass http://backend_cluster;
            proxy_cache_valid 60m;
            add_header Cache-Control "public, immutable";
        }

        # Frontend static assets
        location /static {
            proxy_pass http://backend_cluster;
            proxy_cache_valid 60m;
            add_header Cache-Control "public, max-age=31536000";
        }

        # Default: proxy to frontend/cluster
        location / {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}