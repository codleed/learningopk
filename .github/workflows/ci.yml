name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: ./learningopk

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: learningopk/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: learningopk/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      MISTRAL_API_KEY: ci-only-key-not-used
      BETTER_AUTH_SECRET: ci-only-secret-do-not-use-in-production
      BETTER_AUTH_URL: http://localhost:3001
      FRONTEND_ORIGIN: http://localhost:3000
      MINIO_ENDPOINT: localhost
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ci-only-minio
      MINIO_SECRET_KEY: ci-only-minio-secret
      MINIO_BUCKET: learningo-media
      MINIO_PUBLIC_URL: http://localhost:9000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: learningopk/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Start Postgres + Redis
        working-directory: ./learningopk
        run: docker compose up -d postgres redis
      - name: Wait for services
        working-directory: ./learningopk
        run: |
          for i in {1..30}; do
            if docker compose exec -T postgres pg_isready -U postgres > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres failed to become ready"
          exit 1
      - name: Push database schema
        working-directory: ./learningopk
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5433/learningo
        run: pnpm run db:push
      - name: Run backend tests
        working-directory: ./learningopk/backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5433/learningo
          REDIS_URL: redis://localhost:6379
        run: pnpm test
      - name: Tear down services
        if: always()
        working-directory: ./learningopk
        run: docker compose down --remove-orphans
