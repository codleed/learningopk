name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: ./learningopk

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: learningopk/package-lock.json
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: learningopk/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: learningopk/package-lock.json
      - run: npm ci
      - name: Start Postgres + Redis
        run: docker compose up -d postgres redis
      - name: Wait for services
        run: |
          for i in {1..15}; do
            if docker compose exec -T postgres pg_isready -U postgres > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres failed to become ready"
          exit 1
      - name: Push database schema
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5433/learningo
        run: npm run db:push
      - name: Run backend tests
        working-directory: ./learningopk/backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5433/learningo
          REDIS_URL: redis://localhost:6379
          BETTER_AUTH_SECRET: ci-only-secret-do-not-use-in-production
          BETTER_AUTH_URL: http://localhost:3001
          FRONTEND_ORIGIN: http://localhost:3000
        run: npm test
      - name: Tear down services
        if: always()
        run: docker compose down --remove-orphans
