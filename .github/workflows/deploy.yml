name: Deploy Backend to EC2

on:
  push:
    branches: [main]
    paths:
      - 'learningopk/backend/**'
      - 'learningopk/docker-compose.prod.yml'
      - 'learningopk/infra/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}
          log-public-key: false

      - name: Add EC2 host to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}

      # Git-pull based deploy: the EC2 host keeps a clone of this repo at
      # ~/learningopk. One source of truth — no rsync fighting with git state.
      - name: Pull latest code on EC2
        run: |
          ssh ubuntu@"$EC2_HOST" "cd ~/learningopk && git fetch origin main && git reset --hard origin/main"
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}

      - name: Restart services on EC2
        run: |
          ssh ubuntu@"$EC2_HOST" << 'EOF'
            set -e
            cd ~/learningopk/learningopk

            echo "🐳 Building and starting Docker containers..."
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d --build

            echo "🧹 Pruning dangling images (volumes are preserved)..."
            docker image prune -f

            echo "✅ Deployment completed!"
          EOF
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}

      - name: Health check
        run: |
          echo "🏥 Running health check..."
          sleep 15

          for i in {1..5}; do
            if curl -sSf "http://$EC2_HOST:3001/api/health/live" > /dev/null 2>&1; then
              echo "✅ Health check passed!"
              exit 0
            fi
            echo "⏳ Health check attempt $i/5 failed, retrying in 10s..."
            sleep 10
          done

          echo "❌ Health check failed after 5 attempts"
          exit 1
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}

      - name: Notify on failure
        if: failure()
        run: echo "❌ Deployment failed! Check the logs above for details."
