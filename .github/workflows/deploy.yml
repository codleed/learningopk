name: Deploy Backend to EC2

on:
  push:
    branches: [main]
    paths:
      - 'learningopk/backend/**'
      - 'learningopk/docker-compose.prod.yml'
      - 'learningopk/infra/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}
          log-public-key: false

      - name: Add EC2 to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 54.164.108.139 >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          set -e
          echo "🚀 Starting deployment to EC2..."
          
          # Sync repository to EC2
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='**/node_modules' \
            --exclude='**/.next' \
            --exclude='**/dist' \
            --exclude='*.log' \
            --exclude='learningopk/backups' \
            ./ ubuntu@54.164.108.139:~/learningopk/

      - name: Restart services on EC2
        run: |
          ssh ubuntu@54.164.108.139 << 'EOF'
            set -e
            cd ~/learningopk/learningopk
            
            echo "📦 Pulling latest changes..."
            git reset --hard HEAD
            git clean -fd
            
            echo "🐳 Building and starting Docker containers..."
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --build
            
            echo "🧹 Cleaning up old Docker images..."
            docker system prune -f --volumes
            
            echo "✅ Deployment completed!"
          EOF

      - name: Health check
        run: |
          echo "🏥 Running health check..."
          sleep 15
          
          for i in {1..5}; do
            if curl -sSf http://54.164.108.139/api/health > /dev/null 2>&1; then
              echo "✅ Health check passed!"
              exit 0
            fi
            echo "⏳ Health check attempt $i/5 failed, retrying in 10s..."
            sleep 10
          done
          
          echo "❌ Health check failed after 5 attempts"
          exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check the logs above for details."
